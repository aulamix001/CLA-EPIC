name: Windows VST3 x64
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Package VST3 bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $bundle = 'build-win/EpicLab_artefacts/Release/VST3/EpicLab.vst3'
          if (!(Test-Path "$bundle/Contents/x86_64-win/EpicLab.vst3")) { throw 'Windows x64 VST3 binary missing' }
          Copy-Item build-win/interface-preview.png dist/EpicLab-interface.png
          Copy-Item build-win/interface-slap-room.png dist/EpicLab-Slap-Room.png
          Copy-Item build-win/interface-presets.png dist/EpicLab-Presets.png
          Copy-Item build-win/preset-audit.csv dist/EpicLab-Preset-Audit.csv
          Compress-Archive -Path build-win/preset-audio/* -DestinationPath dist/EpicLab-Audio-Examples.zip
          $presetFiles = @(Get-ChildItem build-win/factory-presets -Recurse -Filter *.vstpreset)
          if ($presetFiles.Count -ne 200) { throw 'Expected 200 exported native VST3 presets' }
          Compress-Archive -Path build-win/factory-presets/* -DestinationPath dist/EpicLab-200-Presets.zip
          Compress-Archive -Path $bundle -DestinationPath dist/EpicLab-Windows-x64-VST3.zip
          $hash = (Get-FileHash dist/EpicLab-Windows-x64-VST3.zip -Algorithm SHA256).Hash.ToLower()
          $presetHash = (Get-FileHash dist/EpicLab-200-Presets.zip -Algorithm SHA256).Hash.ToLower()
          @("$hash  EpicLab-Windows-x64-VST3.zip", "$presetHash  EpicLab-200-Presets.zip", "$((Get-FileHash dist/EpicLab-Audio-Examples.zip -Algorithm SHA256).Hash.ToLower())  EpicLab-Audio-Examples.zip") | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EpicLab-Windows-x64-VST3
          path: dist/*
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $options = @()
          $notes = 'VST3 x64 with a left preset browser (search, categories, types, favorites), framed OFFSET controls, 200 revoiced own programs with defined Close/Slap/rhythmic/Wide/Dark/Bright/Deep/Wash behavior, 200 native vstpreset files, measured audio character tests and ten WAV examples. Editable numeric fields, functional arrows and aligned knob rings. Includes host lifecycle, native editor removal and real VST3 preset roundtrip tests. Extract the ZIP and copy the complete EpicLab.vst3 folder into C:\Program Files\Common Files\VST3. Independent DSP. Preserves the removal fix reported as working by the user in Studio One 8.2.0.114903.'
          if ($env:GITHUB_REF_NAME -match '-rc') { $options += '--prerelease'; $notes = 'Release candidate for compatibility testing. ' + $notes }
          gh release create "$env:GITHUB_REF_NAME" dist/EpicLab-Windows-x64-VST3.zip dist/SHA256SUMS.txt dist/EpicLab-200-Presets.zip dist/EpicLab-interface.png dist/EpicLab-Slap-Room.png dist/EpicLab-Presets.png dist/EpicLab-Preset-Audit.csv dist/EpicLab-Audio-Examples.zip --title "EpicLab $env:GITHUB_REF_NAME - Windows x64" --notes $notes @options
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
